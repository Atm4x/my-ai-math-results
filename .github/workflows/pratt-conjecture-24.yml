name: Pratt Conjecture 24

on:
  push:
    branches: [main]
    paths:
      - 'pratt-conjecture-24/**'
      - '!pratt-conjecture-24/paper.pdf'
      - '.github/workflows/pratt-conjecture-24.yml'
  pull_request:
    paths:
      - 'pratt-conjecture-24/**'
      - '!pratt-conjecture-24/paper.pdf'
      - '.github/workflows/pratt-conjecture-24.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pratt-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lean kernel and finite certificate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Lean source checksum
        working-directory: pratt-conjecture-24/lean
        run: sha256sum --check SHA256.txt
      - name: Install pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/lean-4.34.0-linux.tar.zst"
          curl --fail --location --retry 3 --output "$archive" https://github.com/leanprover/lean4/releases/download/v4.34.0/lean-4.34.0-linux.tar.zst
          echo "caaa98356098c85dc0fcbbd28e1ec66f39eb6551829972b752ff20e1286b646b  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/lean"
          tar --zstd -xf "$archive" -C "$RUNNER_TEMP/lean" --strip-components=1
          echo "$RUNNER_TEMP/lean/bin" >> "$GITHUB_PATH"
      - name: Verify the full theorem (trust level zero)
        working-directory: pratt-conjecture-24/lean
        shell: bash
        run: |
          set -euo pipefail
          bash verify.sh | tee "$RUNNER_TEMP/pratt-lean.log"
      - name: Check the finite construction
        working-directory: pratt-conjecture-24
        shell: bash
        run: |
          set -euo pipefail
          python3 verify_seed.py | tee "$RUNNER_TEMP/pratt-seed.log"
      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pratt-verification
          path: |
            ${{ runner.temp }}/pratt-lean.log
            ${{ runner.temp }}/pratt-seed.log
          if-no-files-found: warn
  paper:
    name: Build LaTeX preprint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-fonts-recommended lmodern
      - name: Compile preprint twice
        working-directory: pratt-conjecture-24
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct -- paper.tex)
          export FORCE_SOURCE_DATE=1
          mkdir -p "$RUNNER_TEMP/pratt-paper"
          pdflatex -interaction=nonstopmode -halt-on-error -output-directory="$RUNNER_TEMP/pratt-paper" paper.tex
          pdflatex -interaction=nonstopmode -halt-on-error -output-directory="$RUNNER_TEMP/pratt-paper" paper.tex
          test -s "$RUNNER_TEMP/pratt-paper/paper.pdf"
          if grep -E 'Overfull|undefined references|undefined citations' "$RUNNER_TEMP/pratt-paper/paper.log"; then
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: pratt-preprint
          path: ${{ runner.temp }}/pratt-paper/paper.pdf
          if-no-files-found: error
  publish:
    name: Publish verified PDF
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [verify, paper]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: pratt-preprint
          path: ${{ runner.temp }}/pratt-paper
      - name: Commit the compiled PDF beside its source
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "Main changed after this run started; not publishing a stale PDF."
            exit 0
          fi
          cp "$RUNNER_TEMP/pratt-paper/paper.pdf" pratt-conjecture-24/paper.pdf
          git add pratt-conjecture-24/paper.pdf
          if git diff --cached --quiet; then
            echo "PDF is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish verified Pratt preprint PDF"
          git push origin HEAD:main
